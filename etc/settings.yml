# Watch Anything — 后端配置文件
#
# 本文件为主配置源（取代原先散落在代码里的默认值）。
# 配置按「域」分组：每个一级键对应一个 struct（见 src/config/settings.py 的子模型），
# 如 email / telegram / llm / monitor / auth / app / csrf / guest / database / source。
# 优先级：环境变量 WA_*  >  本文件  >  Settings 类里的硬编码默认值。
# 因此生产环境可用 WA_EMAIL__SMTP_HOST / WA_LLM__API_KEY / WA_AUTH__SECRET_KEY 等覆盖，无需改文件。
# 嵌套字段的环境变量用双下划线分隔，例如 WA_EMAIL__SMTP_HOST。
#
# 注意：secret_key / token 等敏感项此处仅为开发默认值，生产务必用环境变量覆盖。

# ---------------- 数据库 ----------------
database:
  # 开发用 SQLite（零配置）；生产切 PostgreSQL，例如：
  # url: postgresql+psycopg://user:pass@host:5432/watch_anything
  url: "sqlite:///./watch_anything.db"

# ---------------- 游客限额（MVP，见 AGENTS.md「游客模式与渠道绑定」） ----------------
guest:
  radar_limit: 1
  channel_limit: 1

# ---------------- 应用 ----------------
app:
  name: "Watch Anything"
  cors_origins:
    - "*"
  backend_base_url: "http://127.0.0.1:8000"

# ---------------- 鉴权（轻量 MVP：token 即 user_id 的签名） ----------------
auth:
  # 生产务必用环境变量 WA_AUTH__SECRET_KEY 覆盖为随机长串
  secret_key: "dev-insecure-secret-change-me-please-override"
  token_expire_hours: 720   # 30 天
  # Cookie 的 Secure 属性：仅 HTTPS 才发送。开发环境走 http，必须为 false，
  # 否则浏览器会丢弃 Secure cookie，游客标识无法持久化（每次请求都是新游客）。
  # 生产环境用 WA_AUTH__COOKIE_SECURE=true 覆盖。
  cookie_secure: false

# ---------------- CSRF 防护（Origin 校验，呼应 01_guest.md §8 第 1 步） ----------------
csrf:
  enabled: true
  trusted_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:5174"
    - "http://127.0.0.1:5174"

# ---------------- 外部依赖：邮件（EmailChannel） ----------------
# 现阶段走本地 SMTP（MailHog/Mailpit）：docker run -p 1025:1025 -p 8025:8025 mailhog/mailhog
# 浏览器打开 http://localhost:8025 查看捕获的邮件。生产可改 WA_EMAIL__SMTP_HOST 等切云厂。
# smtp_host 留空则 EmailChannel 退回 mock（不真发）。
email:
  smtp_host: "localhost"
  smtp_port: 1025
  smtp_user: ""
  smtp_password: ""
  smtp_use_tls: false
  smtp_use_ssl: false
  from_email: "noreply@watch-anything.local"

# ---------------- 外部依赖：Telegram（TelegramChannel，待实装 send） ----------------
telegram:
  bot_token: ""
  bot_username: ""

# ---------------- 监控 / LLM ----------------
llm:
  # LLM：OpenAI 兼容接口（可切 Claude / 国产模型）；api_key 留空则解析/打分自动降级
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: "gpt-4o-mini"
  timeout: 20.0          # 单次 LLM 调用超时（秒）

monitor:
  relevance_threshold: 0.6   # 相关性/重要性打分阈值：低于丢弃，高于留存并推送
  scan_interval_seconds: 60  # 轻量 asyncio 循环扫描间隔（秒）
  autostart: true            # 是否在应用启动时自动开启监控调度（测试可置 false）
  max_items_per_source: 20   # 单次扫描每个数据源最多处理的原始条目数（防爆炸）

# ---------------- 数据源抓取 ----------------
source:
  fetch_timeout: 10.0
  user_agent: "WatchAnything/0.1 (+https://...)"
