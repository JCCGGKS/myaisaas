# Watch Anything — 后端配置文件
#
# 本文件为主配置源（取代原先散落在代码里的默认值）。
# 优先级：环境变量 WA_*  >  本文件  >  Settings 类里的硬编码默认值。
# 因此生产环境可用 WA_DATABASE_URL / WA_LLM_API_KEY / WA_SECRET_KEY 等覆盖，无需改文件。
#
# 注意：secret_key / token 等敏感项此处仅为开发默认值，生产务必用环境变量覆盖。

# ---------------- 数据库 ----------------
# 开发用 SQLite（零配置）；生产切 PostgreSQL，例如：
# database_url: postgresql+psycopg://user:pass@host:5432/watch_anything
database_url: "sqlite:///./watch_anything.db"

# ---------------- 游客限额（MVP，见 AGENTS.md「游客模式与渠道绑定」） ----------------
guest_radar_limit: 1
guest_channel_limit: 1

# ---------------- 应用 ----------------
app_name: "Watch Anything"
cors_origins:
  - "*"
backend_base_url: "http://127.0.0.1:8000"

# ---------------- 鉴权（轻量 MVP：token 即 user_id 的签名） ----------------
# 生产务必用环境变量 WA_SECRET_KEY 覆盖为随机长串
secret_key: "dev-insecure-secret-change-me-please-override"
token_expire_hours: 720   # 30 天
# Cookie 的 Secure 属性：仅 HTTPS 才发送。开发环境走 http，必须为 false，
# 否则浏览器会丢弃 Secure cookie，游客标识无法持久化（每次请求都是新游客）。
# 生产环境用 WA_COOKIE_SECURE=true 覆盖。
cookie_secure: false

# ---------------- 外部依赖（通知渠道用） ----------------
# 现阶段 email 走本地 SMTP（MailHog/Mailpit）：docker run -p 1025:1025 -p 8025:8025 mailhog/mailhog
# 浏览器打开 http://localhost:8025 查看捕获的邮件。生产可改 WA_SMTP_HOST 等切云厂。
telegram_bot_token: ""
smtp_host: "localhost"
smtp_port: 1025
smtp_user: ""
smtp_password: ""
smtp_use_tls: false
smtp_use_ssl: false
from_email: "noreply@watch-anything.local"

# ---------------- 监控 / LLM ----------------
# LLM：OpenAI 兼容接口（可切 Claude / 国产模型）；llm_api_key 留空则解析/打分自动降级
llm_base_url: "https://api.openai.com/v1"
llm_api_key: ""
llm_model: "gpt-4o-mini"
llm_timeout: 20.0          # 单次 LLM 调用超时（秒）

relevance_threshold: 0.6   # 相关性/重要性打分阈值：低于丢弃，高于留存并推送

scan_interval_seconds: 60  # 轻量 asyncio 循环扫描间隔（秒）
monitor_autostart: true    # 是否在应用启动时自动开启监控调度（测试可置 false）

max_items_per_source: 20   # 单次扫描每个数据源最多处理的原始条目数（防爆炸）

# 数据源抓取：HTTP 超时与 UA
source_fetch_timeout: 10.0
source_user_agent: "WatchAnything/0.1 (+https://...)"
